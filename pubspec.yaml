name: rentals
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Image Picker
  image_picker: ^1.1.2

  # Firebase
  firebase_core: ^3.2.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.1.0
  firebase_storage: ^12.1.0
  firebase_database: ^11.3.10
  firebase_messaging: ^15.2.10

  # Google Login
  google_sign_in: ^6.2.1

  # Maps & Location
  flutter_map: ^7.0.2
  geocoding: ^4.0.0
  google_places_sdk: ^1.2.1
  google_maps_flutter: ^2.9.0
  latlong2: ^0.9.1
  geolocator: ^14.0.2

  # UI / Utilities
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # App Icon Package
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icons/logo.png"
